<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>暮色哨站 DUSKWATCH</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#07080c;color:#e8f4ff;
  font-family:"Segoe UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif;user-select:none;-webkit-user-select:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.hide{display:none!important}
#hud{position:fixed;inset:0;pointer-events:none;text-shadow:0 1px 4px rgba(0,0,0,.8)}
#cross{position:absolute;left:50%;top:50%;--g:6px}
#cross i{position:absolute;background:#fff;box-shadow:0 0 3px #000}
#cross i:nth-child(1){width:2px;height:8px;left:-1px;top:calc(-8px - var(--g))}
#cross i:nth-child(2){width:2px;height:8px;left:-1px;top:var(--g)}
#cross i:nth-child(3){height:2px;width:8px;top:-1px;left:calc(-8px - var(--g))}
#cross i:nth-child(4){height:2px;width:8px;top:-1px;left:var(--g)}
#cross b{position:absolute;width:2px;height:2px;left:-1px;top:-1px;background:#fff}
#hit{position:absolute;left:50%;top:50%;width:0;height:0;opacity:0}
#hit:before,#hit:after{content:"";position:absolute;left:-13px;top:-1px;width:26px;height:2px;background:#fff;
  -webkit-mask:linear-gradient(90deg,#000 32%,transparent 32%,transparent 68%,#000 68%);mask:linear-gradient(90deg,#000 32%,transparent 32%,transparent 68%,#000 68%)}
#hit:before{transform:rotate(45deg)}#hit:after{transform:rotate(-45deg)}
#hit.on{animation:hit .22s ease-out}
#hit.crit:before,#hit.crit:after{background:#ff5a3c;height:3px}
#hit.kill:before,#hit.kill:after{background:#ff3c3c;left:-18px;width:36px;height:3px}
@keyframes hit{0%{opacity:1;transform:scale(1.5)}100%{opacity:0;transform:scale(.9)}}
#dmgdir{position:absolute;left:50%;top:50%}
#dmgdir .arc{position:absolute;width:300px;height:300px;margin:-150px;border-radius:50%;border:7px solid transparent;
  border-top-color:rgba(255,70,40,.95);filter:blur(1px);opacity:0}
#dmgdir .arc.on{animation:arc 1.1s ease-out}
@keyframes arc{0%{opacity:1}100%{opacity:0}}
#radar{position:absolute;left:22px;top:22px;width:150px;height:150px}
#top{position:absolute;left:50%;top:18px;transform:translateX(-50%);text-align:center}
#wave{font-size:22px;font-weight:700;letter-spacing:.3em;color:#ffb35c}
#left{font-size:13px;letter-spacing:.2em;opacity:.8;margin-top:2px}
#scorebox{position:absolute;right:26px;top:18px;text-align:right}
#score{font:700 34px/1 Consolas,"Cascadia Mono",monospace;letter-spacing:.04em}
#combo{font:700 18px/1.4 Consolas,monospace;color:#5ff;height:26px}
#hpbox{position:absolute;left:26px;bottom:24px;width:260px}
.lab{font-size:12px;letter-spacing:.3em;opacity:.7}
#hpnum{font:700 46px/1 Consolas,monospace}
.bar{height:8px;background:rgba(255,255,255,.14);margin-top:6px;transform:skewX(-20deg)}
#hpbar{height:100%;width:100%;background:linear-gradient(90deg,#3fe,#8f8);transition:width .15s}
#hpbox.low #hpnum{color:#ff5a4a;animation:pulse .7s infinite}
#hpbox.low #hpbar{background:#ff4a3a}
@keyframes pulse{50%{opacity:.45}}
#ammobox{position:absolute;right:26px;bottom:24px;text-align:right}
#wname{font-size:13px;letter-spacing:.3em;opacity:.8}
#ammo{font:700 52px/1 Consolas,monospace}
#ammo small{font-size:22px;opacity:.65;margin-left:8px}
#ammo.empty #mag{color:#ff5a4a}
#slots{display:flex;gap:6px;justify-content:flex-end;margin-top:8px}
#slots div{font-size:11px;padding:3px 8px;border:1px solid rgba(255,255,255,.25);background:rgba(10,16,24,.45);opacity:.55}
#slots div.on{opacity:1;border-color:#5ff;color:#5ff;background:rgba(40,160,180,.2)}
#slots div.out{color:#f66}
#ann{position:absolute;left:50%;top:24%;transform:translateX(-50%);text-align:center;opacity:0;white-space:nowrap}
#ann b{display:block;font-size:52px;letter-spacing:.35em;font-weight:800;color:#fff}
#ann span{display:block;font-size:15px;letter-spacing:.5em;color:#ffb35c;margin-top:4px}
#ann.on{animation:ann 2.6s ease-out}
@keyframes ann{0%{opacity:0;transform:translateX(-50%) scale(1.25)}12%{opacity:1;transform:translateX(-50%) scale(1)}75%{opacity:1}100%{opacity:0}}
#feed{position:absolute;left:50%;top:60%;transform:translateX(-50%);text-align:center;font-size:15px;letter-spacing:.2em}
#feed div{animation:feed 1.4s ease-out forwards}
@keyframes feed{0%{opacity:0;transform:translateY(8px)}15%{opacity:1;transform:none}70%{opacity:1}100%{opacity:0}}
#hint{position:absolute;left:50%;bottom:22%;transform:translateX(-50%);font-size:14px;letter-spacing:.2em;background:rgba(0,0,0,.5);padding:6px 16px}
#rld{position:absolute;left:50%;top:56%;transform:translateX(-50%);width:120px;height:4px;background:rgba(255,255,255,.2)}
#rld i{display:block;height:100%;background:#5ff;width:0}
#fps{position:absolute;left:24px;top:178px;font:11px Consolas,monospace;opacity:.5}
.ovl{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at center,rgba(8,10,18,.35),rgba(4,5,10,.86))}
.ovl h1{font-size:76px;letter-spacing:.3em;font-weight:900;margin-left:.3em;
  background:linear-gradient(180deg,#fff 20%,#ffb35c 70%,#ff5a3c);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 24px rgba(255,120,40,.45))}
.ovl h2{font-size:15px;letter-spacing:1.1em;margin-left:1.1em;font-weight:400;color:#7fe9ff;margin-top:4px}
.ovl p.tag{margin-top:18px;font-size:14px;opacity:.75;letter-spacing:.12em}
.btn{pointer-events:auto;margin-top:26px;padding:14px 56px;font-size:19px;letter-spacing:.4em;font-weight:700;color:#0a0d14;
  background:linear-gradient(180deg,#ffd08a,#ff8a3c);border:0;cursor:pointer;clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%);
  font-family:inherit;transition:transform .12s,filter .12s}
.btn:hover{transform:scale(1.05);filter:brightness(1.15)}
.btn.alt{background:rgba(255,255,255,.12);color:#fff;font-size:15px;padding:10px 40px;margin-top:14px}
.panel{margin-top:26px;display:grid;grid-template-columns:auto 220px 46px;gap:8px 14px;align-items:center;font-size:13px;
  padding:16px 22px;background:rgba(10,14,22,.6);border:1px solid rgba(255,255,255,.12)}
.panel input[type=range]{width:100%;accent-color:#ff9a4c}
.panel select{background:#141a26;color:#fff;border:1px solid #445;padding:3px 6px;font-family:inherit}
.keys{margin-top:20px;font-size:12.5px;opacity:.75;line-height:2;text-align:center;letter-spacing:.06em}
.keys kbd{display:inline-block;border:1px solid rgba(255,255,255,.4);border-radius:3px;padding:0 6px;margin:0 2px;font:12px Consolas,monospace;background:rgba(255,255,255,.08)}
.stats{margin-top:22px;display:grid;grid-template-columns:repeat(4,120px);gap:10px;text-align:center}
.stats div{background:rgba(10,14,22,.6);border:1px solid rgba(255,255,255,.12);padding:12px 4px}
.stats b{display:block;font:700 26px Consolas,monospace;color:#ffb35c}
.stats span{font-size:11px;letter-spacing:.3em;opacity:.7}
#best{margin-top:12px;font-size:13px;letter-spacing:.2em;color:#7fe9ff}
#err{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:18px;padding:40px;text-align:center}
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div id="hud" class="hide">
  <div id="cross"><i></i><i></i><i></i><i></i><b></b></div>
  <div id="hit"></div>
  <div id="dmgdir"><div class="arc"></div><div class="arc"></div><div class="arc"></div><div class="arc"></div></div>
  <canvas id="radar" width="150" height="150"></canvas>
  <div id="fps"></div>
  <div id="top"><div id="wave"></div><div id="left"></div></div>
  <div id="scorebox"><div id="score">0</div><div id="combo"></div></div>
  <div id="hpbox"><div class="lab">生命 / HP</div><div id="hpnum">100</div><div class="bar"><div id="hpbar"></div></div></div>
  <div id="ammobox"><div id="wname"></div><div id="ammo"><span id="mag">0</span><small id="res"></small></div><div id="slots"></div></div>
  <div id="rld" class="hide"><i></i></div>
  <div id="ann"></div>
  <div id="feed"></div>
  <div id="hint" class="hide">点击画面以锁定鼠标</div>
</div>

<div id="menu" class="ovl">
  <h1>暮色哨站</h1>
  <h2>DUSKWATCH</h2>
  <p class="tag">失控的机械正从城市深处涌上天台。你是最后一名哨兵 —— 守到天黑。</p>
  <button class="btn" id="bStart">开始作战</button>
  <div class="panel">
    <label>画质</label><select data-k="q"><option value="0">低</option><option value="1">中</option><option value="2">高</option></select><span></span>
    <label>鼠标灵敏度</label><input type="range" data-k="sens" min="0.3" max="3" step="0.05"><span data-v="sens"></span>
    <label>视野 FOV</label><input type="range" data-k="fov" min="65" max="105" step="1"><span data-v="fov"></span>
    <label>音量</label><input type="range" data-k="vol" min="0" max="1" step="0.02"><span data-v="vol"></span>
  </div>
  <div class="keys">
    <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移动　<kbd>Shift</kbd> 冲刺　<kbd>空格</kbd> 跳跃　<kbd>鼠标左键</kbd> 射击　<kbd>右键</kbd> 瞄准<br>
    <kbd>1</kbd>–<kbd>4</kbd> / <kbd>滚轮</kbd> 切换武器　<kbd>R</kbd> 换弹　<kbd>Esc</kbd> 暂停
  </div>
  <div id="best"></div>
</div>

<div id="pause" class="ovl hide">
  <h2 style="font-size:30px;letter-spacing:.8em">已暂停</h2>
  <button class="btn" id="bResume">继续</button>
  <button class="btn alt" id="bQuit">返回主菜单</button>
  <div class="panel">
    <label>画质</label><select data-k="q"><option value="0">低</option><option value="1">中</option><option value="2">高</option></select><span></span>
    <label>鼠标灵敏度</label><input type="range" data-k="sens" min="0.3" max="3" step="0.05"><span data-v="sens"></span>
    <label>视野 FOV</label><input type="range" data-k="fov" min="65" max="105" step="1"><span data-v="fov"></span>
    <label>音量</label><input type="range" data-k="vol" min="0" max="1" step="0.02"><span data-v="vol"></span>
  </div>
</div>

<div id="over" class="ovl hide">
  <h1 style="font-size:60px">哨站失守</h1>
  <h2>SIGNAL LOST</h2>
  <div class="stats">
    <div><b id="oScore">0</b><span>得分</span></div>
    <div><b id="oWave">0</b><span>波次</span></div>
    <div><b id="oKills">0</b><span>击毁</span></div>
    <div><b id="oAcc">0%</b><span>命中率</span></div>
  </div>
  <div id="oBest" style="margin-top:14px;font-size:14px;letter-spacing:.2em;color:#7fe9ff"></div>
  <button class="btn" id="bAgain">再来一次</button>
  <button class="btn alt" id="bMenu">返回主菜单</button>
</div>

<script>
'use strict';
(function(){
const $=id=>document.getElementById(id);
const canvas=$('gl');
const gl=canvas.getContext('webgl2',{antialias:false,alpha:false,powerPreference:'high-performance'});
if(!gl){document.body.innerHTML='<div id="err">你的浏览器不支持 WebGL2，无法运行本游戏。请使用新版 Chrome / Edge / Firefox。</div>';return;}

// ───────────────────────── utils ─────────────────────────
const TAU=Math.PI*2,PI=Math.PI;
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>a+Math.random()*(b-a);
function rng(seed){return function(){seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function angLerp(a,b,t){const d=((b-a+PI)%TAU+TAU)%TAU-PI;return a+d*t;}
function m4mul(o,oo,a,b){
  for(let c=0;c<4;c++){const b0=b[c*4],b1=b[c*4+1],b2=b[c*4+2],b3=b[c*4+3];
    o[oo+c*4]=a[0]*b0+a[4]*b1+a[8]*b2+a[12]*b3;
    o[oo+c*4+1]=a[1]*b0+a[5]*b1+a[9]*b2+a[13]*b3;
    o[oo+c*4+2]=a[2]*b0+a[6]*b1+a[10]*b2+a[14]*b3;
    o[oo+c*4+3]=a[3]*b0+a[7]*b1+a[11]*b2+a[15]*b3;}
}
function m4trs(o,tx,ty,tz,rx,ry,rz,sx,sy,sz){
  const cx=Math.cos(rx),sX=Math.sin(rx),cy=Math.cos(ry),sY=Math.sin(ry),cz=Math.cos(rz),sZ=Math.sin(rz);
  o[0]=(cy*cz+sY*sX*sZ)*sx;o[1]=(cx*sZ)*sx;o[2]=(-sY*cz+cy*sX*sZ)*sx;o[3]=0;
  o[4]=(-cy*sZ+sY*sX*cz)*sy;o[5]=(cx*cz)*sy;o[6]=(sY*sZ+cy*sX*cz)*sy;o[7]=0;
  o[8]=(sY*cx)*sz;o[9]=(-sX)*sz;o[10]=(cy*cx)*sz;o[11]=0;
  o[12]=tx;o[13]=ty;o[14]=tz;o[15]=1;return o;
}
function m4persp(o,fovy,asp,n,f){const t=1/Math.tan(fovy/2);o.fill(0);o[0]=t/asp;o[5]=t;o[10]=(f+n)/(n-f);o[11]=-1;o[14]=2*f*n/(n-f);return o;}
function m4ortho(o,l,r,b,t,n,f){o.fill(0);o[0]=2/(r-l);o[5]=2/(t-b);o[10]=-2/(f-n);o[12]=-(r+l)/(r-l);o[13]=-(t+b)/(t-b);o[14]=-(f+n)/(f-n);o[15]=1;return o;}
function m4look(o,ex,ey,ez,fx,fy,fz,ux,uy,uz){
  let rx=fy*uz-fz*uy,ry=fz*ux-fx*uz,rz=fx*uy-fy*ux;const l=Math.hypot(rx,ry,rz)||1;rx/=l;ry/=l;rz/=l;
  const vx=ry*fz-rz*fy,vy=rz*fx-rx*fz,vz=rx*fy-ry*fx;
  o[0]=rx;o[4]=ry;o[8]=rz;o[12]=-(rx*ex+ry*ey+rz*ez);
  o[1]=vx;o[5]=vy;o[9]=vz;o[13]=-(vx*ex+vy*ey+vz*ez);
  o[2]=-fx;o[6]=-fy;o[10]=-fz;o[14]=fx*ex+fy*ey+fz*ez;
  o[3]=0;o[7]=0;o[11]=0;o[15]=1;return o;
}

// ───────────────────────── settings ─────────────────────────
const SET={q:1,sens:1,vol:.7,fov:85};
try{Object.assign(SET,JSON.parse(localStorage.getItem('duskwatch.set')||'{}'));}catch(e){}
const saveSet=()=>{try{localStorage.setItem('duskwatch.set',JSON.stringify(SET));}catch(e){}};
let BEST=0;try{BEST=+localStorage.getItem('duskwatch.best')||0;}catch(e){}
const QL=[{sh:1024,ms:0},{sh:2048,ms:2},{sh:4096,ms:4}];

// ───────────────────────── shaders ─────────────────────────
const NOISE=`
float hash(vec3 p){p=fract(p*.3183099+.1);p*=17.;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
float noise(vec3 x){vec3 i=floor(x),f=fract(x);f=f*f*(3.-2.*f);
 return mix(mix(mix(hash(i),hash(i+vec3(1,0,0)),f.x),mix(hash(i+vec3(0,1,0)),hash(i+vec3(1,1,0)),f.x),f.y),
            mix(mix(hash(i+vec3(0,0,1)),hash(i+vec3(1,0,1)),f.x),mix(hash(i+vec3(0,1,1)),hash(i+vec3(1,1,1)),f.x),f.y),f.z);}
float fbm(vec3 p){return noise(p)*.55+noise(p*2.03)*.28+noise(p*4.1)*.17;}
uniform vec3 uSun;
vec3 skyBase(vec3 d){
  float y=max(d.y,0.);
  vec3 c=mix(vec3(1.25,.50,.20),vec3(.50,.20,.42),smoothstep(0.,.20,y));
  c=mix(c,vec3(.045,.055,.17),smoothstep(.12,.7,y));
  float s=max(dot(d,uSun),0.);
  c+=vec3(1.3,.5,.14)*pow(s,5.)*.55;
  return c;
}`;
const VS_SCENE=`#version 300 es
layout(location=0) in vec3 aP;layout(location=1) in vec3 aN;
layout(location=2) in mat4 aM;layout(location=6) in vec4 aC;layout(location=7) in vec4 aD;
uniform mat4 uVP,uLVP;
out vec3 vW,vN,vL;flat out vec3 vLN,vHalf;flat out vec4 vC,vD;out vec4 vS;
void main(){
  vec4 w=aM*vec4(aP,1.);vW=w.xyz;
  vec3 sc=vec3(length(aM[0].xyz),length(aM[1].xyz),length(aM[2].xyz));
  vN=normalize(mat3(aM)*aN);vL=aP*sc;vLN=aN;vHalf=sc*.5;vC=aC;vD=aD;
  vS=uLVP*vec4(vW+vN*.06,1.);
  gl_Position=uVP*w;
}`;
const FS_SCENE=`#version 300 es
precision highp float;precision highp sampler2DShadow;
in vec3 vW,vN,vL;flat in vec3 vLN,vHalf;flat in vec4 vC,vD;in vec4 vS;
uniform vec3 uCam;uniform sampler2DShadow uSh;uniform float uShT,uTime;
uniform vec4 uLP[14];uniform vec3 uLC[14];
out vec4 o;
${NOISE}
void main(){
  vec3 N=normalize(vN),V=normalize(uCam-vW),an=abs(vLN);
  vec2 uv=an.x>.5?vL.zy:an.y>.5?vL.xz:vL.xy;
  vec2 hf=an.x>.5?vHalf.zy:an.y>.5?vHalf.xz:vHalf.xy;
  int m=int(vD.x+.5);
  vec3 alb=vC.rgb,emi=vC.rgb*vC.a;float spec=.15,gloss=24.;
  float edge=min(hf.x-abs(uv.x),hf.y-abs(uv.y));
  float wear=1.-smoothstep(0.,.05,edge);
  if(m==1){
    vec2 g=vW.xz;vec2 t=abs(fract(g/4.)-.5);float gw=max(fwidth(g.x),fwidth(g.y))*.25;
    float seam=smoothstep(.485-gw,.5,max(t.x,t.y))*(1.-clamp(gw*30.,0.,.8));
    float n=fbm(vec3(g*.33,0.));
    alb*=(.62+.6*n)*(1.-.55*seam)*(.9+.2*noise(vec3(g*7.,1.)));
    float pud=smoothstep(.56,.68,fbm(vec3(g*.11,3.)));
    alb*=1.-.45*pud;spec=mix(.12,1.1,pud);gloss=mix(18.,260.,pud);
  }else if(m==2){
    float n=fbm(vL*1.6+vD.z);
    if(an.y<.5){float r=sin(uv.x*20.7),rf=clamp(1.-fwidth(uv.x)*8.,0.,1.);alb*=mix(.89,.78+.22*smoothstep(-.4,.4,r),rf);}
    alb=mix(alb,vec3(.30,.15,.08),smoothstep(.55,.82,n)*.75);alb*=1.+.3*wear;spec=.3;gloss=30.;
  }else if(m==3){
    float n=fbm(vL*1.3+vD.z);alb*=.72+.45*n;
    float s=abs(fract(vL.y/2.5)-.5);alb*=1.-.3*smoothstep(.47,.5,s);
  }else if(m==4){
    float n=fbm(vL*2.+vD.z);vec2 p=abs(fract(uv/1.1)-.5);float ln=smoothstep(.47,.5,max(p.x,p.y));
    alb*=(1.-.45*ln)*(.82+.32*n)*(1.+.35*wear);spec=.6;gloss=60.;
  }else if(m==5){
    float s=step(.5,fract((uv.x+uv.y)*1.3));alb=mix(vec3(.04),vec3(.95,.68,.05),s)*(.75+.4*noise(vL*5.));spec=.3;
  }else if(m==6){
    vec2 p=abs(fract(uv/.31)-.5);float ln=smoothstep(.46,.5,max(p.x,p.y));
    alb*=(1.-.3*ln)*(.88+.22*noise(vL*9.))*(1.+.5*wear);spec=.75;gloss=70.;
  }else if(m==7){
    float n=fbm(vL*.9+vD.z);alb*=.65+.4*n;
    if(an.y<.5){
      vec2 wv=vec2(uv.x/2.3,uv.y/3.1);vec2 cl=floor(wv),f=fract(wv);
      vec2 fw=fwidth(wv)*.75+.001;
      float win=smoothstep(.16-fw.x,.16+fw.x,f.x)*(1.-smoothstep(.84-fw.x,.84+fw.x,f.x))*smoothstep(.22-fw.y,.22+fw.y,f.y)*(1.-smoothstep(.8-fw.y,.8+fw.y,f.y));
      float h=hash(vec3(cl,vD.z*7.));
      alb=mix(alb,vec3(.02,.03,.05),win);
      emi+=win*step(.7,h)*mix(vec3(1.,.62,.28),vec3(.35,.7,1.),step(.92,h))*(.9+h);
      spec=mix(.1,.9,win);gloss=90.;
    }
  }else{

    gl.blitFramebuffer(0,0,w,h,0,0,w,h,gl.COLOR_BUFFER_BIT,gl.NEAREST);}

  gl.disable(gl.DEPTH_TEST);gl.depthMask(false);gl.bindVertexArray(emptyVAO);
  const pass=(p,dst,src)=>{gl.bindFramebuffer(gl.FRAMEBUFFER,dst?dst.fb:null);gl.viewport(0,0,dst?dst.w:canvas.width,dst?dst.h:canvas.height);
    gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,src.tex);gl.drawArrays(gl.TRIANGLES,0,3);};
  gl.useProgram(pBright.p);gl.uniform1i(pBright.u('uT'),0);gl.uniform1f(pBright.u('uTh'),HDR?1.05:.8);pass(pBright,RT.b1a,RT.res);
  gl.useProgram(pBlur.p);gl.uniform1i(pBlur.u('uT'),0);
  gl.uniform2f(pBlur.u('uD'),1/RT.b1a.w,0);pass(pBlur,RT.b1b,RT.b1a);
  gl.uniform2f(pBlur.u('uD'),0,1/RT.b1a.h);pass(pBlur,RT.b1a,RT.b1b);
  gl.uniform2f(pBlur.u('uD'),1/RT.b2a.w,0);pass(pBlur,RT.b2b,RT.b1a);
  gl.uniform2f(pBlur.u('uD'),0,1/RT.b2a.h);pass(pBlur,RT.b2a,RT.b2b);
  gl.uniform2f(pBlur.u('uD'),2/RT.b2a.w,0);pass(pBlur,RT.b2b,RT.b2a);
  gl.uniform2f(pBlur.u('uD'),0,2/RT.b2a.h);pass(pBlur,RT.b2a,RT.b2b);
  gl.useProgram(pComp.p);
  gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,RT.b1a.tex);gl.activeTexture(gl.TEXTURE2);gl.bindTexture(gl.TEXTURE_2D,RT.b2a.tex);
  gl.uniform1i(pComp.u('uT'),0);gl.uniform1i(pComp.u('uB1'),1);gl.uniform1i(pComp.u('uB2'),2);
  gl.uniform2f(pComp.u('uRes'),w,h);gl.uniform1f(pComp.u('uTime'),G.t);
  gl.uniform1f(pComp.u('uDmg'),G.state==='menu'?0:G.dmgFx+(P.hp<30?.25+.12*Math.sin(G.t*6):0));
  gl.uniform1f(pComp.u('uHp'),G.state==='menu'?1:G.state==='dead'?0:clamp(P.hp/45,0,1));
  gl.uniform1f(pComp.u('uHeal'),G.healFx);gl.uniform1f(pComp.u('uFade'),G.fade);
  pass(pComp,null,RT.res);
  gl.activeTexture(gl.TEXTURE0);
}

// ───────────────────────── HUD ─────────────────────────
const E={hud:$('hud'),menu:$('menu'),pause:$('pause'),over:$('over'),cross:$('cross'),hit:$('hit'),wave:$('wave'),left:$('left'),
  score:$('score'),combo:$('combo'),hpbox:$('hpbox'),hpnum:$('hpnum'),hpbar:$('hpbar'),wname:$('wname'),ammo:$('ammo'),mag:$('mag'),res:$('res'),
  slots:$('slots'),ann:$('ann'),feed:$('feed'),hint:$('hint'),rld:$('rld'),fps:$('fps'),best:$('best')};
const RC=$('radar').getContext('2d'),arcs=[...document.querySelectorAll('#dmgdir .arc')];let arcI=0,dirty=true,gapPrev=-1;
WP.forEach((w,i)=>{const d=document.createElement('div');d.textContent=(i+1)+' '+w.s;E.slots.appendChild(d);});
function hudDirty(){dirty=true;}
function retrig(el,cls){el.className=el.className.replace(/\bon\b/g,'').trim();void el.offsetWidth;el.className=(cls?cls+' ':'')+'on';}
function hitMark(k){retrig(E.hit,k);}
function dmgArc(a){const el=arcs[arcI++%arcs.length];el.style.transform='rotate('+a+'rad)';el.classList.remove('on');void el.offsetWidth;el.classList.add('on');}
function announce(a,b){E.ann.innerHTML='<b>'+a+'</b><span>'+(b||'')+'</span>';E.ann.classList.remove('on');void E.ann.offsetWidth;E.ann.classList.add('on');}
function feed(html){const d=document.createElement('div');d.innerHTML=html;E.feed.appendChild(d);while(E.feed.children.length>3)E.feed.removeChild(E.feed.firstChild);setTimeout(()=>d.remove(),1400);}
function updHud(){
  const w=WP[P.w],s=WS[P.w];
  const gap=Math.round(5+((w.pel>1?w.spread*.55:w.spread+P.bloom+Math.hypot(P.vx,P.vz)*.0012)*(1-P.ads*.55))*520);
  if(gap!==gapPrev){gapPrev=gap;E.cross.style.setProperty('--g',gap+'px');}
  if(P.reload>0){E.rld.classList.remove('hide');E.rld.firstChild.style.width=((1-P.reload/w.reload)*100)+'%';}else E.rld.classList.add('hide');
  E.hint.classList.toggle('hide',G.locked||G.noLock||G.state!=='play');
  if(!dirty)return;dirty=false;
  E.wave.textContent=WV.n?'第 '+WV.n+' 波':'准备';
  E.left.textContent=WV.state==='fight'?'剩余敌人 '+(enemies.length+WV.queue.length):'下一波即将到来';
  E.score.textContent=G.score.toLocaleString('en-US');
  E.combo.textContent=G.combo>1?'连杀 ×'+(1+Math.min(G.combo-1,12)*.25).toFixed(2):'';
  const hp=Math.ceil(P.hp);E.hpnum.textContent=hp;E.hpbar.style.width=hp+'%';E.hpbox.classList.toggle('low',hp<=30);
  E.wname.textContent=w.name;E.mag.textContent=s.mag;E.res.textContent='/ '+(s.res===Infinity?'∞':s.res);E.ammo.classList.toggle('empty',s.mag===0);
  [...E.slots.children].forEach((d,i)=>{d.className=(i===P.w?'on ':'')+(WS[i].mag+WS[i].res<=0?'out':'');});
}
function drawRadar(){
  const c=RC,h=75;c.clearRect(0,0,150,150);
  c.fillStyle='rgba(8,14,22,.55)';c.beginPath();c.arc(h,h,72,0,TAU);c.fill();c.strokeStyle='rgba(120,230,255,.55)';c.lineWidth=1.5;c.stroke();
  c.strokeStyle='rgba(120,230,255,.15)';c.beginPath();c.arc(h,h,36,0,TAU);c.stroke();
  const sy=Math.sin(P.yaw),cy=Math.cos(P.yaw),k=72/44;
  const dot=(x,z,col,r)=>{const dx=x-P.x,dz=z-P.z;let px=(-dx*cy+dz*sy)*k,py=(dx*sy+dz*cy)*k;const l=Math.hypot(px,py);if(l>67){px*=67/l;py*=67/l;}
    c.fillStyle=col;c.beginPath();c.arc(h+px,h-py,r,0,TAU);c.fill();};
  for(const g of GATES)dot(g.sx,g.sz,'rgba(255,120,60,.35)',2);
  for(const p of pickups)dot(p.x,p.z,p.k==='hp'?'#5f8':'#fb4',2.2);
  for(const e of enemies)dot(e.x,e.z,e.type==='brute'?'#ff4a1a':e.type==='drone'?'#f6c':'#f66',e.type==='brute'?4.5:2.8);
  c.fillStyle='#fff';c.beginPath();c.moveTo(h,h-6);c.lineTo(h+4.5,h+5);c.lineTo(h-4.5,h+5);c.fill();
}

// ───────────────────────── flow / state ─────────────────────────
function show(el,v){el.classList.toggle('hide',!v);}
function lock(){if(G.noLock)return;try{const p=canvas.requestPointerLock();if(p&&p.catch)p.catch(()=>{});}catch(e){}}
function startGame(){initAudio();resetGame();G.state='play';show(E.menu,false);show(E.over,false);show(E.pause,false);show(E.hud,true);lock();}
function pause(){if(G.state!=='play')return;G.state='pause';show(E.pause,true);M.l=M.r=false;for(const k in K)K[k]=false;}
function resume(){if(G.state!=='pause')return;G.state='play';show(E.pause,false);lock();}
function toMenu(){G.state='menu';show(E.pause,false);show(E.over,false);show(E.hud,false);show(E.menu,true);
  enemies.length=shots.length=pickups.length=0;E.best.textContent=BEST?'最高纪录　'+BEST.toLocaleString('en-US'):'';
  if(document.pointerLockElement)document.exitPointerLock();}
function die(){
  G.state='dead';SFX.over();M.l=M.r=false;
  const nb=G.score>BEST;if(nb){BEST=G.score;try{localStorage.setItem('duskwatch.best',BEST);}catch(e){}}
  setTimeout(()=>{if(G.state!=='dead')return;
    $('oScore').textContent=G.score.toLocaleString('en-US');$('oWave').textContent=WV.n;$('oKills').textContent=G.kills;
    $('oAcc').textContent=(G.shots?Math.round(G.hits/G.shots*100):0)+'%';
    $('oBest').textContent=nb?'★ 新纪录！':'最高纪录　'+BEST.toLocaleString('en-US');
    show(E.over,true);show(E.hud,false);if(document.pointerLockElement)document.exitPointerLock();},1700);
}
$('bStart').onclick=startGame;$('bAgain').onclick=startGame;$('bResume').onclick=resume;$('bQuit').onclick=toMenu;$('bMenu').onclick=toMenu;
document.addEventListener('pointerlockchange',()=>{G.locked=document.pointerLockElement===canvas;if(G.locked)G.everLocked=true;else if(G.state==='play'&&!G.noLock)pause();});
document.addEventListener('pointerlockerror',()=>{if(!G.everLocked)G.noLock=true;});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
window.addEventListener('blur',()=>{for(const k in K)K[k]=false;M.l=M.r=false;});
window.addEventListener('keydown',e=>{
  if(e.code==='Tab'||e.code==='Space')e.preventDefault();
  if(e.repeat)return;K[e.code]=true;
  if(G.state==='play'){
    if(e.code>='Digit1'&&e.code<='Digit4')switchW(+e.code[5]-1);
    else if(e.code==='KeyR')startReload();
    else if(e.code==='KeyQ')switchW(P.last);
    else if((e.code==='Escape'||e.code==='KeyP')&&(G.noLock||!G.locked))pause();
  }else if(G.state==='pause'&&(e.code==='KeyP'||(e.code==='Escape'&&G.noLock)))resume();
});
window.addEventListener('keyup',e=>{K[e.code]=false;});
canvas.addEventListener('mousedown',e=>{
  if(G.state!=='play')return;initAudio();
  if(!G.locked&&!G.noLock){lock();return;}
  if(e.button===0){M.l=true;M.fired=false;}else if(e.button===2)M.r=true;
});
window.addEventListener('mouseup',e=>{if(e.button===0)M.l=false;else if(e.button===2)M.r=false;});
window.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('mousemove',e=>{
  if(G.state!=='play'||(!G.locked&&!G.noLock))return;
  const k=.0022*SET.sens*(1-P.ads*.4),mx=clamp(e.movementX||0,-300,300),my=clamp(e.movementY||0,-300,300);
  P.yaw-=mx*k;P.pitch=clamp(P.pitch-my*k,-1.5,1.5);
  P.swayX=clamp(P.swayX-mx*.00012,-.03,.03);P.swayY=clamp(P.swayY+my*.00012,-.03,.03);
});
window.addEventListener('wheel',e=>{if(G.state==='play')switchW((P.w+(e.deltaY>0?1:3))%4);},{passive:true});
// settings UI
function syncSet(){
  document.querySelectorAll('[data-k]').forEach(el=>{el.value=SET[el.dataset.k];});
  document.querySelectorAll('[data-v]').forEach(el=>{const k=el.dataset.v;el.textContent=k==='vol'?Math.round(SET.vol*100):k==='fov'?SET.fov:(+SET.sens).toFixed(2);});
}
document.querySelectorAll('[data-k]').forEach(el=>el.addEventListener('input',()=>{
  const k=el.dataset.k;SET[k]=+el.value;saveSet();syncSet();
  if(k==='q'){buildShadow();resize();}
  if(k==='vol'&&AU.master)AU.master.gain.value=SET.vol;
}));
SET.q=clamp(SET.q|0,0,2);syncSet();

// ───────────────────────── main loop ─────────────────────────
buildWorld();buildShadow();
E.best.textContent=BEST?'最高纪录　'+BEST.toLocaleString('en-US'):'';
let last=performance.now(),fpsT=0,fpsN=0,frame=0;
function tick(now){
  requestAnimationFrame(tick);
  const dt=Math.min(.05,(now-last)/1000);last=now;
  fpsT+=dt;fpsN++;if(fpsT>=.5){E.fps.textContent=Math.round(fpsN/fpsT)+' FPS';fpsT=0;fpsN=0;}
  sim(dt);
  music();
  render();
  if(G.state==='play'||G.state==='dead'){updHud();if(frame%2===0)drawRadar();}
}
function sim(dt){
  frame++;
  G.fade=Math.min(1,G.fade+dt*1.2);
  if(G.state!=='pause'){
    G.t+=dt;
    if(G.state==='play'){updPlayer(dt);updWave(dt);}
    if(G.state==='play'||G.state==='dead'){const d=G.state==='dead'?dt*.35:dt;updEnemies(d);updShots(d);updPickups(d);
      if(G.state==='dead')P.eyeH+=(.35-P.eyeH)*Math.min(1,dt*3);}
    updFx(dt);P.swayX*=Math.exp(-dt*8);P.swayY*=Math.exp(-dt*8);
  }
}
requestAnimationFrame(tick);
window.DW={G,P,K,M,WV,WS,CAM,COL,enemies,shots,pickups,parts,start:startGame,spawn:spawnEnemy,fire:tryFire,gl,
  step(dt,n){for(let i=0;i<n;i++)sim(dt);render();updHud();drawRadar();}};
})();
</script>
